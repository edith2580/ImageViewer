name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v1.0.7, 비워두면 빌드 아티팩트만 생성)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag) {
            $version = $tag -replace '^[vV]', ''
            Write-Host "Using version from tag: $version ($tag)"
          } else {
            [xml]$csprojXml = Get-Content "src/ImageViewer/ImageViewer.csproj" -Encoding UTF8
            $version = ($csprojXml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            Write-Host "Using version from csproj: $version (artifact-only run)"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  build-windows:
    name: Build Windows (Portable / EXE / MSI)
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sync version
        if: needs.prepare.outputs.tag != ''
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"

          $csprojPath = "src/ImageViewer/ImageViewer.csproj"
          $csproj = [IO.File]::ReadAllText($csprojPath, [Text.Encoding]::UTF8)
          $csproj = $csproj -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
          [IO.File]::WriteAllText($csprojPath, $csproj, (New-Object Text.UTF8Encoding $false))

          $manifestPath = "src/ImageViewer/app.manifest"
          $manifest = [IO.File]::ReadAllText($manifestPath, [Text.Encoding]::UTF8)
          $manifest = $manifest -replace 'assemblyIdentity version="[^"]+"', "assemblyIdentity version=`"$version.0`""
          [IO.File]::WriteAllText($manifestPath, $manifest, (New-Object Text.UTF8Encoding $false))

          $nsiPath = "src/ImageViewer.Installer/ImageViewer.nsi"
          $nsi = [IO.File]::ReadAllText($nsiPath, [Text.Encoding]::UTF8)
          $nsi = $nsi -replace '!define VERSION "[^"]+"', "!define VERSION `"$version`""
          [IO.File]::WriteAllText($nsiPath, $nsi, (New-Object Text.UTF8Encoding $true))

      - name: Ensure NSIS & WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          dotnet tool update --global wix --version 5.0.2

      - name: Build Portable EXE, NSIS Setup EXE, and MSI
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build\publish.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer-${{ needs.prepare.outputs.version }}-windows
          path: |
            artifacts/installer/ImageViewer-${{ needs.prepare.outputs.version }}-portable.exe
            artifacts/installer/ImageViewer-${{ needs.prepare.outputs.version }}-setup.exe
            artifacts/installer/ImageViewer-${{ needs.prepare.outputs.version }}.msi
          if-no-files-found: error

  build-unix:
    name: Build ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
            run_tests: true
          - rid: osx-x64
            os: macos-latest
            run_tests: false
          - rid: linux-x64
            os: ubuntu-latest
            run_tests: true
          - rid: linux-arm64
            os: ubuntu-latest
            run_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sync version
        if: needs.prepare.outputs.tag != ''
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $csprojPath = "src/ImageViewer/ImageViewer.csproj"
          $csproj = [IO.File]::ReadAllText($csprojPath, [Text.Encoding]::UTF8)
          $csproj = $csproj -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
          [IO.File]::WriteAllText($csprojPath, $csproj, (New-Object Text.UTF8Encoding $false))

      - name: Run unit tests
        if: matrix.run_tests
        run: dotnet test tests/ImageViewer.Tests/ImageViewer.Tests.csproj -c Release

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish src/ImageViewer/ImageViewer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -o artifacts/publish/${{ matrix.rid }}

      - name: Package archive
        shell: bash
        run: |
          mkdir -p artifacts/dist
          PUB_DIR="artifacts/publish/${{ matrix.rid }}"
          chmod +x "$PUB_DIR/ImageViewer"
          rm -f "$PUB_DIR"/*.pdb

          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            APP_DIR="artifacts/bundle/${{ matrix.rid }}/ImageViewer.app"
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            cp -R "$PUB_DIR/"* "$APP_DIR/Contents/MacOS/"
            chmod +x "$APP_DIR/Contents/MacOS/ImageViewer"

            cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>ImageViewer</string>
            <key>CFBundleDisplayName</key>
            <string>ImageViewer</string>
            <key>CFBundleIdentifier</key>
            <string>com.edith2580.imageviewer</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.prepare.outputs.version }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.prepare.outputs.version }}</string>
            <key>CFBundleExecutable</key>
            <string>ImageViewer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

            for f in "$APP_DIR/Contents/MacOS/"*.dylib; do
              [ -e "$f" ] && codesign --force --sign - "$f"
            done
            codesign --force --deep --sign - "$APP_DIR"

            tar -czf "artifacts/dist/ImageViewer-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" \
              -C "artifacts/bundle/${{ matrix.rid }}" ImageViewer.app

            DMG_STAGING="artifacts/dmg/${{ matrix.rid }}"
            rm -rf "$DMG_STAGING"
            mkdir -p "$DMG_STAGING"
            cp -R "$APP_DIR" "$DMG_STAGING/"
            ln -s /Applications "$DMG_STAGING/Applications"
            hdiutil create -volname "ImageViewer" \
              -srcfolder "$DMG_STAGING" \
              -ov -format UDZO \
              "artifacts/dist/ImageViewer-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.dmg"
          else
            tar -czf "artifacts/dist/ImageViewer-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" \
              -C "$PUB_DIR" .
          fi

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageViewer-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}
          path: artifacts/dist/ImageViewer-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build-windows, build-unix]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ImageViewer v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/*
